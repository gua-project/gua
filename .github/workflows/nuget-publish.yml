name: NuGet Publish

on:
  push:
    tags:
      - "gua-v[0-9]*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-assets:
    name: Build native assets / ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            core-file: build/native/native/gua-core/Release/gua.dll
            runtime-file: build/native/native/gua-runtime/Release/gua_runtime.dll
          - os: ubuntu-22.04
            rid: linux-x64
            core-file: build/native/native/gua-core/libgua.so
            runtime-file: build/native/native/gua-runtime/libgua_runtime.so
          - os: macos-15-intel
            rid: osx-x64
            core-file: build/native/native/gua-core/libgua.dylib
            runtime-file: build/native/native/gua-runtime/libgua_runtime.dylib
          - os: macos-latest
            rid: osx-arm64
            core-file: build/native/native/gua-core/libgua.dylib
            runtime-file: build/native/native/gua-runtime/libgua_runtime.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: pwsh
        run: .github/scripts/release-version-from-tag.ps1

      - name: Configure native assets
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release -DGUA_BUILD_EXAMPLES=OFF -DGUA_BUILD_GODOT=OFF "-DGUA_VERSION=${{ steps.version.outputs.version }}" "-DGUA_BUILD_ID=${{ github.sha }}"

      - name: Build and test native assets
        run: |
          cmake --build build/native --config Release --parallel
          ctest --test-dir build/native -C Release --output-on-failure

      - name: Stage native assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifacts/native/${{ matrix.rid }}" | Out-Null
          Copy-Item "${{ matrix.core-file }}" "artifacts/native/${{ matrix.rid }}/"
          Copy-Item "${{ matrix.runtime-file }}" "artifacts/native/${{ matrix.rid }}/"

      - name: Upload native assets
        uses: actions/upload-artifact@v4
        with:
          name: gua-nuget-native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}
          if-no-files-found: error

  pack:
    name: Pack .NET packages
    needs: native-assets
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: pwsh
        run: .github/scripts/release-version-from-tag.ps1

      - name: Download native assets
        uses: actions/download-artifact@v4
        with:
          pattern: gua-nuget-native-*
          path: artifacts/download

      - name: Normalize native asset layout
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'linux-x64', 'osx-x64', 'osx-arm64') {
            $source = "artifacts/download/gua-nuget-native-$rid"
            if (-not (Test-Path -LiteralPath $source -PathType Container)) { throw "Missing native artifact: $rid" }
            New-Item -ItemType Directory -Force "artifacts/native/$rid" | Out-Null
            Copy-Item "$source/*" "artifacts/native/$rid/"
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore bindings/dotnet/src/Gua.Testing.Godot/Gua.Testing.Godot.csproj
          dotnet restore bindings/dotnet/src/Gua.Testing/Gua.Testing.csproj
          dotnet restore bindings/dotnet/src/Gua.Runtime/Gua.Runtime.csproj
          dotnet restore bindings/dotnet/src/Gua.Testing.Unity/Gua.Testing.Unity.csproj
          dotnet restore bindings/dotnet/tests/Gua.Visual.Tests/Gua.Visual.Tests.csproj
          dotnet restore bindings/dotnet/tests/Gua.Snapshots.Tests/Gua.Snapshots.Tests.csproj

      - name: Set up Bun for the shared Trace Viewer
        uses: oven-sh/setup-bun@v2

      - name: Build the packaged offline Trace Viewer
        run: |
          bun install --frozen-lockfile
          bun run --filter @gua/inspector build:trace

      - name: Build Gua.Core and Gua.Testing target frameworks
        run: |
          dotnet build bindings/dotnet/src/Gua.Core/Gua.Core.csproj --configuration Release --framework net10.0 --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build bindings/dotnet/src/Gua.Core/Gua.Core.csproj --configuration Release --framework netstandard2.1 --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build bindings/dotnet/src/Gua.Testing/Gua.Testing.csproj --configuration Release --framework net10.0 --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build bindings/dotnet/src/Gua.Testing/Gua.Testing.csproj --configuration Release --framework netstandard2.1 --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build bindings/dotnet/src/Gua.Runtime/Gua.Runtime.csproj --configuration Release --framework net10.0 --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build bindings/dotnet/src/Gua.Runtime/Gua.Runtime.csproj --configuration Release --framework netstandard2.1 --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build bindings/dotnet/src/Gua.Testing.Unity/Gua.Testing.Unity.csproj --configuration Release --framework net10.0 --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build bindings/dotnet/src/Gua.Testing.Unity/Gua.Testing.Unity.csproj --configuration Release --framework net8.0 --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build bindings/dotnet/src/Gua.Testing.Unity/Gua.Testing.Unity.csproj --configuration Release --framework netstandard2.1 --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Build Visual and Recording target frameworks
        run: |
          dotnet build bindings/dotnet/src/Gua.Testing.Visual/Gua.Testing.Visual.csproj --configuration Release --framework net10.0 --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build bindings/dotnet/src/Gua.Testing.Snapshots/Gua.Testing.Snapshots.csproj --configuration Release --framework net10.0 --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build bindings/dotnet/src/Gua.Testing.Visual/Gua.Testing.Visual.csproj --configuration Release --framework netstandard2.1 --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build bindings/dotnet/src/Gua.Testing.Snapshots/Gua.Testing.Snapshots.csproj --configuration Release --framework netstandard2.1 --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build bindings/dotnet/src/Gua.Testing.Recording/Gua.Testing.Recording.csproj --configuration Release --framework net10.0 --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build bindings/dotnet/src/Gua.Testing.Recording/Gua.Testing.Recording.csproj --configuration Release --framework netstandard2.1 --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Build existing consumers
        run: dotnet build bindings/dotnet/src/Gua.Testing.Godot/Gua.Testing.Godot.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test semantic snapshot package
        run: dotnet test bindings/dotnet/tests/Gua.Snapshots.Tests/Gua.Snapshots.Tests.csproj --configuration Release --no-restore

      - name: Test Visual and Recording packages
        run: dotnet test bindings/dotnet/tests/Gua.Visual.Tests/Gua.Visual.Tests.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}
        env:
          GUA_NATIVE_DIR: ${{ github.workspace }}\artifacts\native\win-x64

      - name: Pack Gua.Core
        run: dotnet pack bindings/dotnet/src/Gua.Core/Gua.Core.csproj --configuration Release --no-build -p:GuaPackageVersion=${{ steps.version.outputs.version }} -p:PackageVersion=${{ steps.version.outputs.version }} -p:GuaNativeAssetsRoot=${{ github.workspace }}/artifacts/native

      - name: Pack Gua.Testing
        run: dotnet pack bindings/dotnet/src/Gua.Testing/Gua.Testing.csproj --configuration Release --no-build -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack Gua.Testing.Godot
        run: dotnet pack bindings/dotnet/src/Gua.Testing.Godot/Gua.Testing.Godot.csproj --configuration Release --no-build -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack Unity runtime and testing host
        run: |
          dotnet pack bindings/dotnet/src/Gua.Runtime/Gua.Runtime.csproj --configuration Release --no-build -p:GuaPackageVersion=${{ steps.version.outputs.version }} -p:PackageVersion=${{ steps.version.outputs.version }} -p:GuaNativeAssetsRoot=${{ github.workspace }}/artifacts/native
          dotnet pack bindings/dotnet/src/Gua.Testing.Unity/Gua.Testing.Unity.csproj --configuration Release --no-build -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Verify native package contents
        shell: pwsh
        run: scripts/verify-dotnet-native-packages.ps1 -PackageDirectory artifacts/packages -Version '${{ steps.version.outputs.version }}'

      - name: Pack Gua.Testing.Snapshots
        run: dotnet pack bindings/dotnet/src/Gua.Testing.Snapshots/Gua.Testing.Snapshots.csproj --configuration Release --no-build -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack Gua.Testing.Visual
        run: dotnet pack bindings/dotnet/src/Gua.Testing.Visual/Gua.Testing.Visual.csproj --configuration Release --no-build -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack Gua.Testing.Recording
        run: dotnet pack bindings/dotnet/src/Gua.Testing.Recording/Gua.Testing.Recording.csproj --configuration Release --no-build -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gua-nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  package-smoke:
    name: Package smoke / ${{ matrix.rid }}
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: gua-nuget-packages
          path: artifacts/packages

      - name: Restore package-only smoke
        run: dotnet restore bindings/dotnet/tests/Gua.PackageSmoke/Gua.PackageSmoke.csproj -p:GuaPackageVersion=${{ needs.pack.outputs.version }} --source "${{ github.workspace }}/artifacts/packages"

      - name: Run package-only smoke
        run: dotnet run --project bindings/dotnet/tests/Gua.PackageSmoke/Gua.PackageSmoke.csproj --configuration Release --no-restore -p:GuaPackageVersion=${{ needs.pack.outputs.version }}
        env:
          GUA_NATIVE_DIR: ""
          GUA_RUNTIME_NATIVE_DIR: ""

  publish:
    name: Publish .NET packages
    needs:
      - pack
      - package-smoke
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: gua-nuget-packages
          path: artifacts/packages

      - name: Check NuGet trusted publisher user
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ vars.NUGET_USER }}")) {
            throw "Set the NUGET_USER repository variable to the nuget.org profile name used by the trusted publishing policy."
          }

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages to NuGet
        shell: pwsh
        run: |
          Push-Location artifacts/packages
          Get-ChildItem . -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
          }
          Pop-Location
