name: Syntax Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  godot-desktop-addon-contract:
    name: Godot desktop / ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            arch: x86_64
            archive: Godot_v4.7-stable_win64.exe.zip
            executable: Godot_v4.7-stable_win64_console.exe
            preset: Windows Desktop
            output: artifacts/godot-desktop/GuaGodotSample.exe
            smoke: artifacts/godot-desktop/GuaGodotSample.exe
          - os: ubuntu-22.04
            rid: linux-x64
            arch: x86_64
            archive: Godot_v4.7-stable_linux.x86_64.zip
            executable: Godot_v4.7-stable_linux.x86_64
            preset: Linux/X11
            output: artifacts/godot-desktop/GuaGodotSample
            smoke: artifacts/godot-desktop/GuaGodotSample
          - os: macos-15-intel
            rid: osx-x64
            arch: x86_64
            archive: Godot_v4.7-stable_macos.universal.zip
            executable: Godot.app/Contents/MacOS/Godot
            preset: macOS x86_64
            output: artifacts/godot-desktop/GuaGodotSample.app
            smoke: artifacts/godot-desktop/GuaGodotSample.app/Contents/MacOS/GuaGodotSample
          - os: macos-latest
            rid: osx-arm64
            arch: arm64
            archive: Godot_v4.7-stable_macos.universal.zip
            executable: Godot.app/Contents/MacOS/Godot
            preset: macOS arm64
            output: artifacts/godot-desktop/GuaGodotSample.app
            smoke: artifacts/godot-desktop/GuaGodotSample.app/Contents/MacOS/GuaGodotSample
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Debug and Release native builds
        run: |
          cmake -S . -B build/godot-debug -DCMAKE_BUILD_TYPE=Debug -DGUA_GODOT_CONFIGURATION=Debug -DGUA_GODOT_ARCHITECTURE=${{ matrix.arch }} -DGUA_BUILD_IMGUI_EXAMPLE=OFF
          cmake -S . -B build/godot-release -DCMAKE_BUILD_TYPE=Release -DGUA_GODOT_CONFIGURATION=Release -DGUA_GODOT_ARCHITECTURE=${{ matrix.arch }} -DGUA_BUILD_IMGUI_EXAMPLE=OFF

      - name: Build Debug and Release Godot GDExtensions
        run: |
          cmake --build build/godot-debug --config Debug --target gua-godot --parallel 2
          cmake --build build/godot-release --config Release --target gua-godot --parallel 2

      - name: Verify desktop addon contract
        shell: pwsh
        run: scripts/verify-godot-desktop-addon.ps1 -Rid '${{ matrix.rid }}' -RequireBinaries

      - name: Install Godot 4.7 editor and export templates
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/${{ matrix.archive }}' -OutFile godot.zip
          Invoke-WebRequest https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz -OutFile templates.zip
          Expand-Archive godot.zip -DestinationPath .godot-editor
          Expand-Archive templates.zip -DestinationPath .godot-export-templates
          $templateRoot = if ($IsWindows) { Join-Path $env:APPDATA 'Godot' } elseif ($IsMacOS) { Join-Path $HOME 'Library/Application Support/Godot' } else { Join-Path $HOME '.local/share/godot' }
          $templateDirectory = Join-Path $templateRoot 'export_templates/4.7.stable'
          New-Item -ItemType Directory -Force $templateDirectory | Out-Null
          Copy-Item ".godot-export-templates/templates/*" $templateDirectory -Recurse
          if ($IsMacOS) {
            scripts/prepare-godot-macos-export-template.ps1 `
              -TemplateArchive (Join-Path $templateDirectory 'macos.zip') `
              -Architecture '${{ matrix.arch }}'
          }
          if (-not $IsWindows) { chmod +x '.godot-editor/${{ matrix.executable }}' }

      - name: Export desktop Release player
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/godot-desktop | Out-Null
          $godot = (Resolve-Path '.godot-editor/${{ matrix.executable }}').Path
          $output = Join-Path $env:GITHUB_WORKSPACE '${{ matrix.output }}'
          & $godot --headless --path examples/godot-gdscript --export-release '${{ matrix.preset }}' $output
          $exportExitCode = $LASTEXITCODE
          $outputExists = Test-Path -LiteralPath $output
          Write-Host "Godot export exit code: $exportExitCode; output exists: $outputExists"
          if (-not $outputExists) {
            throw "Godot ${{ matrix.rid }} Release export did not create $output (exit code $exportExitCode)."
          }
          if ($exportExitCode -ne 0) {
            if ('${{ matrix.rid }}' -ne 'linux-x64') {
              throw "Godot ${{ matrix.rid }} Release export exited with code $exportExitCode."
            }
            Write-Warning "Godot linux-x64 editor exited with code $exportExitCode after creating the Release player; continuing to the external-control smoke."
            $global:LASTEXITCODE = 0
          }

      - name: Run external-control smoke against desktop Release
        shell: pwsh
        run: |
          $executable = '${{ matrix.smoke }}'
          if ('${{ matrix.rid }}'.StartsWith('osx-')) {
            $macOSDirectory = Join-Path '${{ matrix.output }}' 'Contents/MacOS'
            $candidates = @(Get-ChildItem -LiteralPath $macOSDirectory -File)
            if ($candidates.Count -ne 1) {
              $candidateNames = $candidates.Name -join ', '
              throw "Expected one macOS app executable in $macOSDirectory, found $($candidates.Count): $candidateNames"
            }
            $executable = $candidates[0].FullName
          }
          bun scripts/verify-godot-desktop-release.ts $executable '${{ matrix.rid }}'

  godot-web-addon-contract:
    name: Godot Web Debug / Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 4.0.20
          actions-cache-folder: emsdk-cache

      - name: Build Debug Godot Web extension
        shell: pwsh
        run: scripts/build-web-native.ps1 -Configuration Debug

      - name: Build Release Godot Web extension
        shell: pwsh
        run: scripts/build-web-native.ps1 -Configuration Release

      - name: Verify Debug and Release addon contract
        shell: pwsh
        run: scripts/verify-godot-web-addon.ps1 -RequireBinaries

      - name: Install Godot 4.7 editor and export templates
        shell: bash
        run: |
          curl -fsSLO https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          curl -fsSLO https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_export_templates.tpz -d .godot-export-templates
          chmod +x Godot_v4.7-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.stable"
          cp -R .godot-export-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.stable/"

      - name: Link Release Godot Web export
        shell: bash
        run: |
          mkdir -p artifacts/godot-web-release
          ./Godot_v4.7-stable_linux.x86_64 --headless --path examples/godot-gdscript --export-release Web "$GITHUB_WORKSPACE/artifacts/godot-web-release/index.html"
          test -s artifacts/godot-web-release/index.html

      - name: Run Release Web in-page bridge smoke
        run: bun scripts/verify-godot-web-release.ts artifacts/godot-web-release

      - name: Preserve Web Release export for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-release-diagnostics
          path: artifacts/godot-web-release
          if-no-files-found: ignore
          retention-days: 3

  portable-native:
    name: Native bridge / ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            core-dir: build/portable/native/gua-core/Release
            runtime-dir: build/portable/native/gua-runtime/Release
            core-file: build/portable/native/gua-core/Release/gua.dll
            runtime-file: build/portable/native/gua-runtime/Release/gua_runtime.dll
          - os: ubuntu-22.04
            rid: linux-x64
            core-dir: build/portable/native/gua-core
            runtime-dir: build/portable/native/gua-runtime
            core-file: build/portable/native/gua-core/libgua.so
            runtime-file: build/portable/native/gua-runtime/libgua_runtime.so
          - os: macos-15-intel
            rid: osx-x64
            core-dir: build/portable/native/gua-core
            runtime-dir: build/portable/native/gua-runtime
            core-file: build/portable/native/gua-core/libgua.dylib
            runtime-file: build/portable/native/gua-runtime/libgua_runtime.dylib
          - os: macos-latest
            rid: osx-arm64
            core-dir: build/portable/native/gua-core
            runtime-dir: build/portable/native/gua-runtime
            core-file: build/portable/native/gua-core/libgua.dylib
            runtime-file: build/portable/native/gua-runtime/libgua_runtime.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure portable native targets
        run: cmake -S . -B build/portable -DCMAKE_BUILD_TYPE=Release -DGUA_BUILD_GODOT=OFF -DGUA_BUILD_IMGUI_EXAMPLE=OFF

      - name: Build portable native targets
        run: |
          cmake --build build/portable --config Release --parallel
          ctest --test-dir build/portable -C Release --output-on-failure

      - name: Restore selector tests
        run: dotnet restore bindings/dotnet/tests/Gua.Selector.Tests/Gua.Selector.Tests.csproj

      - name: Test remote bridge and selector contracts
        run: dotnet test bindings/dotnet/tests/Gua.Selector.Tests/Gua.Selector.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"
        env:
          GUA_NATIVE_DIR: ${{ github.workspace }}/${{ matrix.core-dir }}
          GUA_RUNTIME_NATIVE_DIR: ${{ github.workspace }}/${{ matrix.runtime-dir }}

      - name: Build Value managed targets
        run: dotnet build bindings/dotnet/src/Gua.Core/Gua.Core.csproj --configuration Release --no-restore

      - name: Verify Observe dynamic and static imports
        shell: pwsh
        run: |
          scripts/verify-observe-imports.ps1 -AssemblyPath bindings/dotnet/src/Gua.Core/bin/Release/netstandard2.1/Gua.Core.dll -ExpectedLibrary gua
          dotnet build bindings/dotnet/src/Gua.Core/Gua.Core.csproj --configuration Release --no-restore -f netstandard2.1 -p:DefineConstants=GUA_STATIC_LINK -o build/observe-static-link
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/verify-observe-imports.ps1 -AssemblyPath build/observe-static-link/Gua.Core.dll -ExpectedLibrary __Internal

      - name: Stage native package assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifacts/native/${{ matrix.rid }}" | Out-Null
          Copy-Item "${{ matrix.core-file }}" "artifacts/native/${{ matrix.rid }}/"
          Copy-Item "${{ matrix.runtime-file }}" "artifacts/native/${{ matrix.rid }}/"

      - name: Upload native package assets
        uses: actions/upload-artifact@v4
        with:
          name: gua-native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}
          if-no-files-found: error

  pack-native-nuget:
    name: Pack native NuGet contract
    needs: portable-native
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download native assets
        uses: actions/download-artifact@v4
        with:
          pattern: gua-native-*
          path: artifacts/download

      - name: Normalize native asset layout
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'linux-x64', 'osx-x64', 'osx-arm64') {
            $source = "artifacts/download/gua-native-$rid"
            if (-not (Test-Path -LiteralPath $source -PathType Container)) { throw "Missing native artifact: $rid" }
            New-Item -ItemType Directory -Force "artifacts/native/$rid" | Out-Null
            Copy-Item "$source/*" "artifacts/native/$rid/"
          }

      - name: Pack native packages
        run: |
          dotnet pack bindings/dotnet/src/Gua.Core/Gua.Core.csproj --configuration Release -p:GuaPackageVersion=0.0.0-ci -p:PackageVersion=0.0.0-ci -p:GuaNativeAssetsRoot=${{ github.workspace }}/artifacts/native
          dotnet pack bindings/dotnet/src/Gua.Runtime/Gua.Runtime.csproj --configuration Release -p:GuaPackageVersion=0.0.0-ci -p:PackageVersion=0.0.0-ci -p:GuaNativeAssetsRoot=${{ github.workspace }}/artifacts/native

      - name: Set up Bun for the packaged Trace Viewer
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Pack framework-independent Trace writer
        run: |
          bun install --frozen-lockfile
          bun run --filter @gua/inspector build:trace
          dotnet pack bindings/dotnet/src/Gua.Testing/Gua.Testing.csproj --configuration Release -p:GuaPackageVersion=0.0.0-ci -p:PackageVersion=0.0.0-ci

      - name: Verify native package contents
        shell: pwsh
        run: scripts/verify-dotnet-native-packages.ps1 -PackageDirectory artifacts/packages -Version 0.0.0-ci

      - name: Upload native NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: gua-native-nuget
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  package-smoke:
    name: Package smoke / ${{ matrix.rid }}
    needs: pack-native-nuget
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download native NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: gua-native-nuget
          path: artifacts/packages

      - name: Restore package-only smoke
        run: dotnet restore bindings/dotnet/tests/Gua.PackageSmoke/Gua.PackageSmoke.csproj -p:GuaPackageVersion=0.0.0-ci --source "${{ github.workspace }}/artifacts/packages"

      - name: Run package-only smoke
        run: dotnet run --project bindings/dotnet/tests/Gua.PackageSmoke/Gua.PackageSmoke.csproj --configuration Release --no-restore -p:GuaPackageVersion=0.0.0-ci
        env:
          GUA_NATIVE_DIR: ""
          GUA_RUNTIME_NATIVE_DIR: ""

      - name: Restore package-only external Trace runner
        run: dotnet restore examples/dotnet-trace/Gua.TraceExample.csproj -p:TracePackageVersion=0.0.0-ci --source "${{ github.workspace }}/artifacts/packages" --source https://api.nuget.org/v3/index.json

      - name: Verify framework-free external Trace runner
        run: dotnet run --project examples/dotnet-trace/Gua.TraceExample.csproj --configuration Release --no-restore -p:TracePackageVersion=0.0.0-ci -- artifacts/external-runner
        env:
          GUA_NATIVE_DIR: ""
          GUA_RUNTIME_NATIVE_DIR: ""

  cpp:
    name: C++ / CMake
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build/cpp -DCMAKE_BUILD_TYPE=Debug -DGUA_BUILD_GODOT=OFF

      - name: Build
        run: |
          cmake --build build/cpp --parallel
          ctest --test-dir build/cpp --output-on-failure

  csharp:
    name: C# / dotnet
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun for the shared Trace Viewer
        uses: oven-sh/setup-bun@v2

      - name: Build the offline Trace Viewer
        run: |
          bun install --frozen-lockfile
          bun run --filter @gua/inspector build:trace

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build native runtime for managed clock tests
        run: |
          cmake -S . -B build/dotnet-native -DCMAKE_BUILD_TYPE=Release -DGUA_BUILD_EXAMPLES=OFF -DGUA_BUILD_GODOT=OFF
          cmake --build build/dotnet-native --config Release --target gua --parallel

      - name: Restore
        run: |
          dotnet restore bindings/dotnet/src/Gua.Testing.Godot/Gua.Testing.Godot.csproj
          dotnet restore bindings/dotnet/src/Gua.Testing/Gua.Testing.csproj
          dotnet restore bindings/dotnet/src/Gua.Runtime/Gua.Runtime.csproj
          dotnet restore bindings/dotnet/src/Gua.Testing.Unity/Gua.Testing.Unity.csproj
          dotnet restore bindings/dotnet/tests/Gua.Unity.Integration.Tests/Gua.Unity.Integration.Tests.csproj
          dotnet restore bindings/dotnet/tests/Gua.Visual.Tests/Gua.Visual.Tests.csproj
          dotnet restore bindings/dotnet/tests/Gua.Snapshots.Tests/Gua.Snapshots.Tests.csproj
          dotnet restore examples/unity-smoke/Gua.UnitySmoke.csproj

      - name: Build Gua.Core and Gua.Testing target frameworks
        run: |
          dotnet build bindings/dotnet/src/Gua.Core/Gua.Core.csproj --configuration Release --framework net10.0 --no-restore
          dotnet build bindings/dotnet/src/Gua.Core/Gua.Core.csproj --configuration Release --framework netstandard2.1 --no-restore
          dotnet build bindings/dotnet/src/Gua.Testing/Gua.Testing.csproj --configuration Release --framework net10.0 --no-restore
          dotnet build bindings/dotnet/src/Gua.Testing/Gua.Testing.csproj --configuration Release --framework netstandard2.1 --no-restore
          dotnet build bindings/dotnet/src/Gua.Runtime/Gua.Runtime.csproj --configuration Release --framework net10.0 --no-restore
          dotnet build bindings/dotnet/src/Gua.Runtime/Gua.Runtime.csproj --configuration Release --framework netstandard2.1 --no-restore
          dotnet build bindings/dotnet/src/Gua.Testing.Unity/Gua.Testing.Unity.csproj --configuration Release --framework net10.0 --no-restore
          dotnet build bindings/dotnet/src/Gua.Testing.Unity/Gua.Testing.Unity.csproj --configuration Release --framework net8.0 --no-restore
          dotnet build bindings/dotnet/src/Gua.Testing.Unity/Gua.Testing.Unity.csproj --configuration Release --framework netstandard2.1 --no-restore

      - name: Build WebGL static-link managed assemblies
        run: |
          dotnet build bindings/dotnet/src/Gua.Core/Gua.Core.csproj --configuration Release --framework netstandard2.1 --no-restore -p:DefineConstants=GUA_STATIC_LINK -o artifacts/webgl-managed
          dotnet build bindings/dotnet/src/Gua.Runtime/Gua.Runtime.csproj --configuration Release --framework netstandard2.1 --no-restore -p:DefineConstants=GUA_STATIC_LINK -o artifacts/webgl-managed

      - name: Build Visual and Recording target frameworks
        run: |
          dotnet build bindings/dotnet/src/Gua.Testing.Visual/Gua.Testing.Visual.csproj --configuration Release --framework net10.0 --no-restore
          dotnet build bindings/dotnet/src/Gua.Testing.Snapshots/Gua.Testing.Snapshots.csproj --configuration Release --framework net10.0 --no-restore
          dotnet build bindings/dotnet/src/Gua.Testing.Visual/Gua.Testing.Visual.csproj --configuration Release --framework netstandard2.1 --no-restore
          dotnet build bindings/dotnet/src/Gua.Testing.Snapshots/Gua.Testing.Snapshots.csproj --configuration Release --framework netstandard2.1 --no-restore
          dotnet build bindings/dotnet/src/Gua.Testing.Recording/Gua.Testing.Recording.csproj --configuration Release --framework net10.0 --no-restore
          dotnet build bindings/dotnet/src/Gua.Testing.Recording/Gua.Testing.Recording.csproj --configuration Release --framework netstandard2.1 --no-restore

      - name: Pack semantic snapshot package
        run: dotnet pack bindings/dotnet/src/Gua.Testing.Snapshots/Gua.Testing.Snapshots.csproj --configuration Release --no-build

      - name: Build existing consumers and Unity smoke host
        run: |
          dotnet build bindings/dotnet/src/Gua.Testing.Godot/Gua.Testing.Godot.csproj --configuration Release --no-restore
          dotnet build bindings/dotnet/tests/Gua.Unity.Integration.Tests/Gua.Unity.Integration.Tests.csproj --configuration Release --no-restore
          dotnet build examples/unity-smoke/Gua.UnitySmoke.csproj --configuration Release --no-restore

      - name: Test semantic snapshot package
        run: dotnet test bindings/dotnet/tests/Gua.Snapshots.Tests/Gua.Snapshots.Tests.csproj --configuration Release --no-restore

      - name: Test Visual and Recording packages
        run: dotnet test bindings/dotnet/tests/Gua.Visual.Tests/Gua.Visual.Tests.csproj --configuration Release --no-restore
        env:
          GUA_NATIVE_DIR: ${{ github.workspace }}/build/dotnet-native/native/gua-core

  typescript:
    name: TypeScript / tsc
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up .NET for Inspector generated-code compilation
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Test TypeScript packages
        run: |
          bun test scripts/verify-godot-web-release.test.ts
          bun run --filter gua-webmcp test
          bun run --filter gua-value test
          bun run --filter @gua/bridge-ws test
          bun run --filter gui-mcp test
          bun run --filter @gua/inspector test
