name: Remote build variants
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-variants:
    name: Remote variant / ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: shipping, flavor: shipping, remote: 'off', configuration: Release, godot: true }
          - { name: development, flavor: development, remote: 'on', configuration: Debug, godot: true }
          - { name: qa, flavor: qa, remote: 'on', configuration: Release, godot: true }
          - { name: ai-player, flavor: ai-player, remote: 'on', configuration: Release, godot: true }
          - { name: development-local, flavor: development, remote: 'off', configuration: Debug, godot: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build and accept the actual variant
        shell: pwsh
        run: |
          $args = @{ Flavor = '${{ matrix.flavor }}'; Remote = '${{ matrix.remote }}'; Configuration = '${{ matrix.configuration }}'; BuildParallel = 4 }
          if ('${{ matrix.godot }}' -eq 'true') { $args.WithGodot = $true }
          scripts/test-remote-build-variant.ps1 @args
      - name: Reject invalid configuration combinations
        if: matrix.name == 'shipping'
        shell: pwsh
        run: scripts/test-remote-build-config.ps1
      - name: Download existing Godot editor and Release template
        if: matrix.godot
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip' -OutFile godot.zip
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz' -OutFile templates.zip
          Expand-Archive godot.zip godot-editor
          Expand-Archive templates.zip godot-templates
      - name: Run packaged Godot consumer and preserve selected package
        if: matrix.godot
        shell: pwsh
        run: |
          $package = Get-ChildItem 'build/remote-${{ matrix.flavor }}-${{ matrix.remote }}-${{ matrix.configuration }}' -Directory -Filter 'package-*' | Sort-Object Name | Select-Object -Last 1
          $args = @{ PackageDirectory = $package.FullName; GodotExecutable = "$PWD/godot-editor/Godot_v4.7-stable_win64_console.exe"; Flavor = '${{ matrix.flavor }}'; Remote = '${{ matrix.remote }}' }
          if ('${{ matrix.flavor }}' -eq 'development') { $args.Editor = $true } else { $args.ReleaseTemplate = "$PWD/godot-templates/templates/windows_release_x86_64.exe" }
          scripts/test-godot-remote-build.ps1 @args
          New-Item -ItemType Directory -Force artifacts/selected | Out-Null
          Copy-Item -LiteralPath $package.FullName -Destination artifacts/selected/package -Recurse
          if ('${{ matrix.name }}' -in 'shipping','qa','ai-player') {
            scripts/stage-cpp-imports.ps1 -BuildDirectory 'build/remote-${{ matrix.flavor }}-${{ matrix.remote }}-${{ matrix.configuration }}' -PackageDirectory $package.FullName -OutputDirectory artifacts/cpp-imports
          }
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'shipping' || matrix.name == 'qa' || matrix.name == 'ai-player'
        with:
          name: cpp-imports-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/cpp-imports
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.godot
        with:
          name: selected-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/selected/package
          if-no-files-found: error
      - name: Preserve build and packaged-consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-${{ matrix.name }}-${{ github.sha }}
          path: |
            build/remote-*/remote-build-evidence/**
            build/remote-*/Testing/Temporary/**
            build/remote-*/package-*/**
            build/godot-variant-*/consumer.log
            build/godot-variant-*/userdata/**/gua-variant-result.json
            build/cfg-*/**
          if-no-files-found: error
  package-mixing:
    needs: [windows-variants, godot-web-game]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: selected-*-${{ github.sha }}
          path: artifacts/mixing
      - uses: actions/download-artifact@v4
        with:
          pattern: cpp-imports-*-${{ github.sha }}
          path: artifacts/cpp-imports
      - uses: actions/download-artifact@v4
        with:
          name: godot-web-provider-${{ github.sha }}
          path: artifacts/godot-web-provider
      - shell: pwsh
        run: |
          scripts/test-remote-package-mixing.ps1 -ShippingPackage artifacts/mixing/selected-shipping-${{ github.sha }} -QAPackage artifacts/mixing/selected-qa-${{ github.sha }} -AIPlayerPackage artifacts/mixing/selected-ai-player-${{ github.sha }}
          scripts/test-unity-package-mixing.ps1 -ShippingNativeDirectory artifacts/mixing/selected-shipping-${{ github.sha }} -QARuntimeLibrary artifacts/mixing/selected-qa-${{ github.sha }}/gua_runtime.dll
      - name: Validate game-owned Windows native policy and automatic selection
        shell: pwsh
        run: |
          $packages = @{
            ShippingPackage = 'artifacts/mixing/selected-shipping-${{ github.sha }}'
            TestingPackage = 'artifacts/mixing/selected-qa-${{ github.sha }}'
            PlayerPackage = 'artifacts/mixing/selected-ai-player-${{ github.sha }}'
          }
          scripts/test-game-owned-native-policy.ps1 @packages
          scripts/stage-game-build-bundle.ps1 @packages -OutputDirectory artifacts/game-sdk-win-x64
          scripts/test-game-build-nuget.ps1 -BundleRoot artifacts/game-sdk-win-x64
          # Read the old official package only as a substitution-test input.
          # A deprecated release is not a recommended game dependency.
          New-Item -ItemType Directory -Force artifacts/official-repro | Out-Null
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup><ItemGroup><PackageReference Include="Gua.Runtime" Version="[1.2.0]" /></ItemGroup></Project>' | Set-Content artifacts/official-repro/repro.csproj
          dotnet restore artifacts/official-repro/repro.csproj --packages artifacts/official-repro/packages
          if ($LASTEXITCODE) { throw 'Cannot obtain the pinned official reproduction input.' }
          $official = @{
            OfficialCoreAssembly = 'artifacts/official-repro/packages/gua.core/1.2.0/lib/net10.0/Gua.Core.dll'
            OfficialRuntimeAssembly = 'artifacts/official-repro/packages/gua.runtime/1.2.0/lib/net10.0/Gua.Runtime.dll'
            OfficialCoreNative = 'artifacts/official-repro/packages/gua.core/1.2.0/runtimes/win-x64/native/gua.dll'
            OfficialRuntimeNative = 'artifacts/official-repro/packages/gua.runtime/1.2.0/runtimes/win-x64/native/gua_runtime.dll'
          }
          scripts/test-automatic-game-build.ps1 -BundleRoot artifacts/game-sdk-win-x64 @official
      - name: Validate provider-built game policy templates
        shell: pwsh
        run: |
          $generator = scripts/get-msvc-generator.ps1
          cmake -S . -B build/game-policy-template -G $generator -A x64 -DGUA_BUILD_GODOT=OFF -DGUA_BUILD_EXAMPLES=OFF -DGUA_DISTRIBUTION_FLAVOR=shipping -DGUA_ENABLE_REMOTE_AUTOMATION=OFF
          if ($LASTEXITCODE) { throw 'Game policy template configure failed.' }
          cmake --build build/game-policy-template --config Release --target gua-game-policy-template gua-editor-policy-template gua-godot-policy-template --parallel 2
          if ($LASTEXITCODE) { throw 'Game policy template compilation failed.' }
          dotnet build bindings/dotnet/src/Gua.Runtime -c Release -f net10.0 --nologo -v quiet -o artifacts/native-policy-managed
          if ($LASTEXITCODE) { throw 'Policy test managed fixture compilation failed.' }
          scripts/test-native-game-policy-template.ps1 -ShippingPackage 'artifacts/mixing/selected-shipping-${{ github.sha }}' -TestingPackage 'artifacts/mixing/selected-qa-${{ github.sha }}' -PlayerTemplate build/game-policy-template/native/gua-game-policy/Release/GamePolicyTemplate.dll -EditorTemplate build/game-policy-template/native/gua-game-policy/Release/EditorPolicyTemplate.dll -CoreAssembly artifacts/native-policy-managed/Gua.Core.dll -RuntimeAssembly artifacts/native-policy-managed/Gua.Runtime.dll
      - name: Validate game-owned Godot loader before native load
        shell: pwsh
        run: |
          $packages = @{
            ShippingPackage = 'artifacts/mixing/selected-shipping-${{ github.sha }}'
            TestingPackage = 'artifacts/mixing/selected-qa-${{ github.sha }}'
            PlayerPackage = 'artifacts/mixing/selected-ai-player-${{ github.sha }}'
          }
          scripts/stage-godot-game-sdk.ps1 @packages -OutputDirectory artifacts/godot-native-game-sdk
          scripts/stage-godot-web-game-sdk.ps1 -ProviderInputs artifacts/godot-web-provider -NativeSdkDirectory artifacts/godot-native-game-sdk -OutputDirectory artifacts/godot-game-sdk
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip' -OutFile artifacts/godot-game-editor.zip
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz' -OutFile artifacts/godot-game-templates.zip
          Expand-Archive artifacts/godot-game-editor.zip artifacts/godot-game-editor
          Expand-Archive artifacts/godot-game-templates.zip artifacts/godot-game-templates
          Invoke-WebRequest 'https://github.com/gua-project/gua/releases/download/gua-v1.2.0/gua-godot-addon-v1.2.0.zip' -OutFile artifacts/official-godot.zip
          if ((Get-FileHash artifacts/official-godot.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'effcad4cfc6083528bee4e469e171047cd9d2d49547a09d16be04845fcda7873') { throw 'Official reproduction input digest changed.' }
          Expand-Archive artifacts/official-godot.zip artifacts/official-godot
          scripts/test-godot-game-owned-policy.ps1 -SdkDirectory artifacts/godot-game-sdk -GodotExecutable "$PWD/artifacts/godot-game-editor/Godot_v4.7-stable_win64_console.exe" -ReleaseTemplate "$PWD/artifacts/godot-game-templates/templates/windows_release_x86_64.exe" -OfficialGodotExtension "$PWD/artifacts/official-godot/addons/gua/bin/gua_godot.windows.release.x86_64.dll"
          scripts/test-godot-native-lease.ps1 -SdkDirectory artifacts/godot-game-sdk -GodotExecutable "$PWD/artifacts/godot-game-editor/Godot_v4.7-stable_win64.exe" -OutputDirectory build/godot-native-lease-acceptance
      - name: Accept Web export after native Editor preparation in the combined SDK
        shell: pwsh
        run: |
          scripts/test-godot-web-game-policy.ps1 -SdkDirectory artifacts/godot-game-sdk -GodotExecutable "$PWD/artifacts/godot-game-editor/Godot_v4.7-stable_win64.exe" -ReleaseTemplate "$PWD/artifacts/godot-game-templates/templates/web_dlink_nothreads_release.zip" -OutputDirectory build/godot-combined-web-acceptance
          $env:CHROME_EXECUTABLE = "$env:ProgramFiles/Google/Chrome/Application/chrome.exe"
          foreach ($case in 'off','testing','player') {
            bun scripts/verify-godot-web-game-policy.ts "build/godot-combined-web-acceptance/$case" $case artifacts/godot-web-provider/testing/gua.wasm
            if ($LASTEXITCODE) { throw "Combined SDK Web acceptance failed: $case" }
          }
      - name: Accept the actual Godot .NET game, export and Editor loader
        shell: pwsh
        run: |
          scripts/get-godot-dotnet-test-tools.ps1 -OutputDirectory artifacts/godot-dotnet-tools
          $engine = "$PWD/artifacts/godot-dotnet-tools/editor/Godot_v4.7-stable_mono_win64/Godot_v4.7-stable_mono_win64.exe"
          $feeds = @(Get-ChildItem build -Directory -Filter 'nuget-game-consumer-*')
          if ($feeds.Count -ne 1) { throw 'Require the one private fixture feed from this clean CI job.' }
          scripts/test-godot-dotnet-game-policy.ps1 -BundleRoot artifacts/game-sdk-win-x64 -DependencyFeed "$($feeds[0].FullName)/feed" -GodotExecutable $engine -OutputDirectory build/godot-dotnet-game-acceptance
          scripts/test-godot-dotnet-export.ps1 -MatrixDirectory build/godot-dotnet-game-acceptance -BundleRoot artifacts/game-sdk-win-x64 -GodotExecutable $engine -ReleaseTemplate artifacts/godot-dotnet-tools/windows_release_x86_64.exe -OutputDirectory build/godot-dotnet-export-acceptance -OfficialCoreAssembly artifacts/official-repro/packages/gua.core/1.2.0/lib/net10.0/Gua.Core.dll -OfficialRuntimeAssembly artifacts/official-repro/packages/gua.runtime/1.2.0/lib/net10.0/Gua.Runtime.dll
          scripts/test-godot-dotnet-editor.ps1 -MatrixDirectory build/godot-dotnet-game-acceptance -BundleRoot artifacts/game-sdk-win-x64 -GodotExecutable $engine -OutputDirectory build/godot-dotnet-editor-acceptance
      - name: Package build-only game SDK candidates
        shell: pwsh
        run: |
          scripts/stage-cpp-game-sdk.ps1 -BundleRoot artifacts/game-sdk-win-x64 -ShippingBuild 'artifacts/cpp-imports/cpp-imports-shipping-${{ github.sha }}' -TestingBuild 'artifacts/cpp-imports/cpp-imports-qa-${{ github.sha }}' -PlayerBuild 'artifacts/cpp-imports/cpp-imports-ai-player-${{ github.sha }}' -PlayerTemplate build/game-policy-template/native/gua-game-policy/Release/GamePolicyTemplate.dll -OutputDirectory artifacts/cpp-game-sdk
          scripts/package-game-build-candidates.ps1 -DotnetSdkDirectory artifacts/game-sdk-win-x64 -GodotSdkDirectory artifacts/godot-game-sdk -CppSdkDirectory artifacts/cpp-game-sdk -Version 0.0.0-ci -RuntimeVersion 0.0.0-ci -ExpectedNativeSource '${{ github.sha }}' -OutputDirectory artifacts/game-build-candidates
          scripts/test-cpp-game-candidate.ps1 -CandidateDirectory artifacts/game-build-candidates -OutputDirectory build/cpp-candidate-acceptance
      - uses: actions/upload-artifact@v4
        with:
          name: game-build-candidates-${{ github.sha }}
          path: artifacts/game-build-candidates
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-mixing-${{ github.sha }}
          path: |
            build/package-mixing-*/results.json
            build/unity-mixing-*/result.json
            build/game-owned-native-*/**/*.log
            build/game-owned-native-*/results.json
            build/automatic-game-*/**/*.log
            build/automatic-game-*/results.json
            build/nuget-game-consumer-*/**/*.log
            build/nuget-game-consumer-*/results.json
            build/godot-dotnet-*-acceptance/*.json
            build/godot-dotnet-*-acceptance/*.log
            build/godot-dotnet-*-acceptance/*.stdout
            build/godot-dotnet-*-acceptance/*.stderr
            build/godot-combined-web-acceptance/**/*.json
            build/godot-combined-web-acceptance/*.stderr
            build/godot-combined-web-acceptance/*.stdout
            artifacts/game-sdk-win-x64/**
            artifacts/godot-game-sdk/**
            build/cpp-candidate-acceptance/**
            build/godot-game-policy-*/**/*.log
            build/godot-game-policy-*/**/*.native-loads.json
            build/godot-game-policy-*/results.json
            build/godot-native-lease-acceptance/**/*.json
            build/godot-native-lease-acceptance/**/*.log
            build/godot-native-lease-acceptance/**/*.stderr
            build/godot-native-lease-acceptance/**/*.stdout
            build/native-game-policy-*/**/*.log
            build/native-game-policy-*/**/*.native-loads.json
            build/native-game-policy-*/results.json
          if-no-files-found: error
  godot-web-game:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 4.0.20
          actions-cache-folder: emsdk-cache
      - shell: pwsh
        run: |
          bun test scripts/test-godot-web-game-guard.test.ts
          if ($LASTEXITCODE) { throw 'Web guard unit acceptance failed.' }
          scripts/build-godot-web-game-inputs.ps1 -OutputDirectory artifacts/godot-web-provider -BuildDirectory build/godot-web-provider
          scripts/stage-godot-web-game-sdk.ps1 -ProviderInputs artifacts/godot-web-provider -OutputDirectory artifacts/godot-web-game-sdk
          scripts/get-godot-web-test-tools.ps1 -OutputDirectory artifacts/godot-web-tools
          scripts/test-godot-web-game-policy.ps1 -SdkDirectory artifacts/godot-web-game-sdk -GodotExecutable artifacts/godot-web-tools/editor/Godot_v4.7-stable_linux.x86_64 -ReleaseTemplate artifacts/godot-web-tools/web-release-dlink.zip -OutputDirectory build/godot-web-game-acceptance
          foreach ($case in 'off','testing','player','custom','swap','csp') {
            $folder = if ($case -in 'swap','csp') { 'off' } else { $case }
            $mode = if ($case -eq 'custom') { 'off' } else { $case }
            bun scripts/verify-godot-web-game-policy.ts "build/godot-web-game-acceptance/$folder" $mode artifacts/godot-web-provider/testing/gua.wasm
            if ($LASTEXITCODE) { throw "Real browser Web acceptance failed: $case" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: godot-web-provider-${{ github.sha }}
          path: artifacts/godot-web-provider
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-web-acceptance-${{ github.sha }}
          path: |
            build/godot-web-game-acceptance/**/*.json
            build/godot-web-game-acceptance/*.stdout
            build/godot-web-game-acceptance/*.stderr
            artifacts/godot-web-provider/*.log
          if-no-files-found: error
  web-variants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: shipping, remote: 'off' }
          - { flavor: development, remote: 'on' }
          - { flavor: qa, remote: 'on' }
          - { flavor: ai-player, remote: 'on' }
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 4.0.20
          actions-cache-folder: emsdk-cache
      - shell: pwsh
        run: scripts/build-web-native.ps1 -RuntimeOnly -Flavor '${{ matrix.flavor }}' -Remote '${{ matrix.remote }}' -Configuration Release -BuildId '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: static-web-${{ matrix.flavor }}-${{ github.sha }}
          path: build/web-release/stage/unity-web
          if-no-files-found: error
  portable-distribution:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        variant:
          - { flavor: shipping, remote: 'off', optin: 'OFF' }
          - { flavor: ai-player, remote: 'on', optin: 'ON' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: |
          cmake -S . -B build/distribution -DCMAKE_BUILD_TYPE=Release -DGUA_BUILD_GODOT=OFF -DGUA_BUILD_EXAMPLES=OFF -DGUA_DISTRIBUTION_FLAVOR=${{ matrix.variant.flavor }} -DGUA_ENABLE_REMOTE_AUTOMATION=${{ matrix.variant.optin }} -DGUA_BUILD_ID=${{ github.sha }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/distribution --target gua gua-build-variant-tests --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/distribution -R '^gua-build-variant-tests$' --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          scripts/stage-remote-build.ps1 -BuildDirectory build/distribution -OutputDirectory artifacts/package -Flavor '${{ matrix.variant.flavor }}' -Remote '${{ matrix.variant.remote }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-${{ matrix.os }}-${{ matrix.variant.flavor }}-${{ github.sha }}
          path: |
            artifacts/package
            build/distribution/Testing/Temporary/LastTest.log
          if-no-files-found: error
