name: Gua Release

on:
  push:
    tags:
      - "gua-v[0-9]*"

permissions:
  contents: write

concurrency:
  group: gua-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-assets:
    name: Build Windows release assets
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: pwsh
        run: .github/scripts/release-version-from-tag.ps1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Value browser entry
        run: bun run --filter gua-value-tools build

      - name: Build web inspector
        run: bun run --filter @gua/inspector build

      - name: Build Tauri inspector
        shell: pwsh
        run: |
          scripts/set-inspector-release-version.ps1 -Version '${{ steps.version.outputs.version }}'
          bun run --filter @gua/inspector tauri:build

      - name: Configure Debug native build
        run: cmake --preset windows-msvc-debug "-DGUA_VERSION=${{ steps.version.outputs.version }}" "-DGUA_GODOT_PLUGIN_VERSION=${{ steps.version.outputs.version }}" "-DGUA_BUILD_ID=${{ github.sha }}"

      - name: Configure Release native build
        run: cmake --preset windows-msvc-release "-DGUA_VERSION=${{ steps.version.outputs.version }}" "-DGUA_GODOT_PLUGIN_VERSION=${{ steps.version.outputs.version }}" "-DGUA_BUILD_ID=${{ github.sha }}"

      - name: Verify injected release metadata and Godot configurations
        shell: pwsh
        run: |
          $expected = @{
            'build/windows-msvc-debug/CMakeCache.txt' = 'Debug'
            'build/windows-msvc-release/CMakeCache.txt' = 'Release'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $cache = Get-Content $entry.Key -Raw
            if ($cache -notmatch 'GUA_VERSION:STRING=${{ steps.version.outputs.version }}' -or
                $cache -notmatch 'GUA_GODOT_PLUGIN_VERSION:STRING=${{ steps.version.outputs.version }}' -or
                $cache -notmatch 'GUA_BUILD_ID:STRING=${{ github.sha }}' -or
                $cache -notmatch "GUA_GODOT_CONFIGURATION:STRING=$($entry.Value)") {
              throw "Configured Gua metadata or Godot configuration is invalid: $($entry.Key)"
            }
          }

      - name: Build Debug and Release Godot GDExtensions
        run: |
          cmake --build --preset windows-msvc-debug --target gua-godot
          cmake --build --preset windows-msvc-release --target gua-godot

      - name: Verify Windows Godot addon contract
        shell: pwsh
        run: |
          scripts/verify-godot-windows-addon.ps1 -RequireBinaries
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'vswhere.exe was not found.' }
          $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($dumpbin)) { throw 'dumpbin.exe was not found.' }
          foreach ($configuration in 'debug', 'release') {
            $binary = "examples/godot-gdscript/addons/gua/bin/gua_godot.windows.$configuration.x86_64.dll"
            $dependencies = (& $dumpbin /dependents $binary) -join "`n"
            if ($LASTEXITCODE -ne 0 -or $dependencies -match '(?i)gua_runtime\.dll') {
              throw "Godot $configuration GDExtension must embed gua-runtime."
            }
          }

      - name: Build Unity native plugins
        run: cmake --build --preset windows-msvc-release --target gua gua-runtime --config Release

      - name: Package release assets
        id: package
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP "gua-release-assets"
          $godotRoot = Join-Path $env:RUNNER_TEMP "gua-godot-plugin"
          $godotTarget = Join-Path $godotRoot "addons/gua"
          $version = '${{ steps.version.outputs.version }}'

          Remove-Item -Recurse -Force $assets, $godotRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $assets, $godotTarget, (Join-Path $godotTarget "bin") | Out-Null

          scripts/stage-godot-addon-sources.ps1 -AddonDirectory $godotTarget -Version $version
          Copy-Item "examples/godot-gdscript/addons/gua/bin/*.dll" (Join-Path $godotTarget "bin")

          Compress-Archive -Path (Join-Path $godotRoot "addons") -DestinationPath (Join-Path $assets "gua-godot-plugin-windows-v$version.zip") -CompressionLevel Optimal

          $nativeRoot = Join-Path $env:RUNNER_TEMP "gua-native-win-x64"
          New-Item -ItemType Directory -Force $nativeRoot | Out-Null
          Copy-Item "build/windows-msvc-release/native/gua-core/Release/gua.dll" $nativeRoot
          Copy-Item "build/windows-msvc-release/native/gua-runtime/Release/gua_runtime.dll" $nativeRoot
          Copy-Item "LICENSE" $nativeRoot
          Compress-Archive -Path (Join-Path $nativeRoot "*") -DestinationPath (Join-Path $assets "gua-native-win-x64-v$version.zip") -CompressionLevel Optimal

          Copy-Item "packages/inspector/src-tauri/target/release/bundle" (Join-Path $assets "inspector") -Recurse
          "assets=$assets" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gua-release-v${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.assets }}
          if-no-files-found: error

      - name: Upload Unity native plugins
        uses: actions/upload-artifact@v4
        with:
          name: gua-unity-native-v${{ steps.version.outputs.version }}
          path: |
            build/windows-msvc-release/native/gua-core/Release/gua.dll
            build/windows-msvc-release/native/gua-runtime/Release/gua_runtime.dll
          if-no-files-found: error

      - name: Upload Windows Godot GDExtensions
        uses: actions/upload-artifact@v4
        with:
          name: gua-godot-desktop-win-x64-v${{ steps.version.outputs.version }}
          path: |
            examples/godot-gdscript/addons/gua/bin/gua_godot.windows.debug.x86_64.dll
            examples/godot-gdscript/addons/gua/bin/gua_godot.windows.release.x86_64.dll
          if-no-files-found: error

  portable-native:
    name: Build release native / ${{ matrix.rid }}
    needs: windows-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
            arch: x86_64
            core-file: build/native/native/gua-core/libgua.so
            runtime-file: build/native/native/gua-runtime/libgua_runtime.so
          - os: macos-15-intel
            rid: osx-x64
            arch: x86_64
            core-file: build/native/native/gua-core/libgua.dylib
            runtime-file: build/native/native/gua-runtime/libgua_runtime.dylib
          - os: macos-latest
            rid: osx-arm64
            arch: arm64
            core-file: build/native/native/gua-core/libgua.dylib
            runtime-file: build/native/native/gua-runtime/libgua_runtime.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure native and Godot targets
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release -DGUA_BUILD_EXAMPLES=OFF -DGUA_GODOT_CONFIGURATION=Release -DGUA_GODOT_ARCHITECTURE=${{ matrix.arch }} "-DGUA_VERSION=${{ needs.windows-assets.outputs.version }}" "-DGUA_GODOT_PLUGIN_VERSION=${{ needs.windows-assets.outputs.version }}" "-DGUA_BUILD_ID=${{ github.sha }}"
          cmake -S . -B build/godot-debug -DCMAKE_BUILD_TYPE=Debug -DGUA_BUILD_EXAMPLES=OFF -DGUA_GODOT_CONFIGURATION=Debug -DGUA_GODOT_ARCHITECTURE=${{ matrix.arch }} "-DGUA_VERSION=${{ needs.windows-assets.outputs.version }}" "-DGUA_GODOT_PLUGIN_VERSION=${{ needs.windows-assets.outputs.version }}" "-DGUA_BUILD_ID=${{ github.sha }}"

      - name: Build and test release native targets
        run: |
          cmake --build build/native --parallel 2
          ctest --test-dir build/native --output-on-failure
          cmake --build build/godot-debug --target gua-godot --parallel 2

      - name: Verify desktop Godot binaries
        shell: pwsh
        run: scripts/verify-godot-desktop-addon.ps1 -Rid '${{ matrix.rid }}' -RequireBinaries

      - name: Verify Linux native closure
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          ldd '${{ matrix.core-file }}' | tee artifacts-ldd-core.txt
          ldd '${{ matrix.runtime-file }}' | tee artifacts-ldd-runtime.txt
          ! grep -q 'not found' artifacts-ldd-core.txt artifacts-ldd-runtime.txt
          readelf -d '${{ matrix.core-file }}' | grep -F '$ORIGIN'
          readelf -d '${{ matrix.runtime-file }}' | grep -F '$ORIGIN'
          ! ldd "examples/godot-gdscript/addons/gua/bin/gua_godot.linux.release.${{ matrix.arch }}.so" | grep -F 'gua_runtime'

      - name: Verify macOS native closure
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          otool -L '${{ matrix.core-file }}'
          otool -L '${{ matrix.runtime-file }}'
          otool -l '${{ matrix.core-file }}' | grep -A2 LC_RPATH | grep -F '@loader_path'
          otool -l '${{ matrix.runtime-file }}' | grep -A2 LC_RPATH | grep -F '@loader_path'
          ! otool -L "examples/godot-gdscript/addons/gua/bin/gua_godot.macos.release.${{ matrix.arch }}.dylib" | grep -F 'gua_runtime'

      - name: Package release native archive
        shell: pwsh
        run: |
          $stage = "artifacts/native/${{ matrix.rid }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "${{ matrix.core-file }}" $stage
          Copy-Item "${{ matrix.runtime-file }}" $stage
          Copy-Item LICENSE $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/gua-native-${{ matrix.rid }}-v${{ needs.windows-assets.outputs.version }}.zip" -CompressionLevel Optimal

      - name: Upload release native archive
        uses: actions/upload-artifact@v4
        with:
          name: gua-release-native-${{ matrix.rid }}
          path: |
            artifacts/gua-native-${{ matrix.rid }}-v${{ needs.windows-assets.outputs.version }}.zip
            artifacts/native/${{ matrix.rid }}
          if-no-files-found: error

      - name: Upload desktop Godot GDExtensions
        uses: actions/upload-artifact@v4
        with:
          name: gua-godot-desktop-${{ matrix.rid }}-v${{ needs.windows-assets.outputs.version }}
          path: examples/godot-gdscript/addons/gua/bin/gua_godot.*
          if-no-files-found: error

  native-nuget:
    name: Pack release native NuGet packages
    needs:
      - windows-assets
      - portable-native
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.windows-assets.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Windows native libraries
        uses: actions/download-artifact@v4
        with:
          name: gua-unity-native-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/download/windows

      - name: Download portable native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: gua-release-native-*
          path: artifacts/download/portable

      - name: Normalize native asset layout
        shell: pwsh
        run: |
          $contracts = @(
            @{ Rid = 'win-x64'; Root = 'artifacts/download/windows'; Core = 'gua.dll'; Runtime = 'gua_runtime.dll' },
            @{ Rid = 'linux-x64'; Root = 'artifacts/download/portable/gua-release-native-linux-x64'; Core = 'libgua.so'; Runtime = 'libgua_runtime.so' },
            @{ Rid = 'osx-x64'; Root = 'artifacts/download/portable/gua-release-native-osx-x64'; Core = 'libgua.dylib'; Runtime = 'libgua_runtime.dylib' },
            @{ Rid = 'osx-arm64'; Root = 'artifacts/download/portable/gua-release-native-osx-arm64'; Core = 'libgua.dylib'; Runtime = 'libgua_runtime.dylib' }
          )

          foreach ($contract in $contracts) {
            $target = "artifacts/native/$($contract.Rid)"
            New-Item -ItemType Directory -Force $target | Out-Null
            foreach ($fileName in @($contract.Core, $contract.Runtime)) {
              $matches = @(Get-ChildItem $contract.Root -Recurse -File -Filter $fileName)
              if ($matches.Count -ne 1) {
                throw "Expected exactly one $fileName for $($contract.Rid), found $($matches.Count)."
              }
              Copy-Item $matches[0].FullName $target
            }
          }

      - name: Pack native NuGet packages
        run: |
          dotnet pack bindings/dotnet/src/Gua.Core/Gua.Core.csproj --configuration Release -p:GuaPackageVersion=${{ needs.windows-assets.outputs.version }} -p:PackageVersion=${{ needs.windows-assets.outputs.version }} -p:GuaNativeAssetsRoot=${{ github.workspace }}/artifacts/native
          dotnet pack bindings/dotnet/src/Gua.Runtime/Gua.Runtime.csproj --configuration Release -p:GuaPackageVersion=${{ needs.windows-assets.outputs.version }} -p:PackageVersion=${{ needs.windows-assets.outputs.version }} -p:GuaNativeAssetsRoot=${{ github.workspace }}/artifacts/native

      - name: Verify native package contents
        shell: pwsh
        run: scripts/verify-dotnet-native-packages.ps1 -PackageDirectory artifacts/packages -Version '${{ needs.windows-assets.outputs.version }}'

      - name: Upload native NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: gua-release-native-nuget-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  native-package-smoke:
    name: Smoke release native package / ${{ matrix.rid }}
    needs: native-nuget
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download native NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: gua-release-native-nuget-v${{ needs.native-nuget.outputs.version }}
          path: artifacts/packages

      - name: Restore package-only smoke
        run: dotnet restore bindings/dotnet/tests/Gua.PackageSmoke/Gua.PackageSmoke.csproj -p:GuaPackageVersion=${{ needs.native-nuget.outputs.version }} --source "${{ github.workspace }}/artifacts/packages"

      - name: Run package-only smoke
        run: dotnet run --project bindings/dotnet/tests/Gua.PackageSmoke/Gua.PackageSmoke.csproj --configuration Release --no-restore -p:GuaPackageVersion=${{ needs.native-nuget.outputs.version }}
        env:
          GUA_NATIVE_DIR: ""
          GUA_RUNTIME_NATIVE_DIR: ""

  unity-desktop-native:
    name: Aggregate Unity desktop native plugins
    needs:
      - windows-assets
      - portable-native
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows native plugins
        uses: actions/download-artifact@v4
        with:
          name: gua-unity-native-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/download/windows

      - name: Download portable native plugins
        uses: actions/download-artifact@v4
        with:
          pattern: gua-release-native-*
          path: artifacts/download/portable

      - name: Build Unity native layout and Universal 2 libraries
        shell: pwsh
        run: |
          $root = 'artifacts/unity-native'
          foreach ($rid in 'win-x64', 'linux-x64', 'osx-universal') { New-Item -ItemType Directory -Force (Join-Path $root $rid) | Out-Null }
          foreach ($file in 'gua.dll', 'gua_runtime.dll') {
            $match = @(Get-ChildItem artifacts/download/windows -Recurse -File -Filter $file)
            if ($match.Count -ne 1) { throw "Expected one Windows $file, found $($match.Count)." }
            Copy-Item $match[0].FullName (Join-Path $root 'win-x64')
          }
          foreach ($file in 'libgua.so', 'libgua_runtime.so') {
            $match = @(Get-ChildItem artifacts/download/portable/gua-release-native-linux-x64 -Recurse -File -Filter $file)
            if ($match.Count -ne 1) { throw "Expected one Linux $file, found $($match.Count)." }
            Copy-Item $match[0].FullName (Join-Path $root 'linux-x64')
          }
          foreach ($file in 'libgua.dylib', 'libgua_runtime.dylib') {
            $intel = @(Get-ChildItem artifacts/download/portable/gua-release-native-osx-x64 -Recurse -File -Filter $file)
            $arm = @(Get-ChildItem artifacts/download/portable/gua-release-native-osx-arm64 -Recurse -File -Filter $file)
            if ($intel.Count -ne 1 -or $arm.Count -ne 1) { throw "Expected one dylib per macOS architecture for $file." }
            lipo -create $intel[0].FullName $arm[0].FullName -output (Join-Path $root "osx-universal/$file")
            lipo (Join-Path $root "osx-universal/$file") -verify_arch x86_64 arm64
            if ($LASTEXITCODE -ne 0) { throw "Universal 2 verification failed for $file." }
          }

      - name: Upload Unity desktop native plugins
        uses: actions/upload-artifact@v4
        with:
          name: gua-unity-desktop-native-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/unity-native
          if-no-files-found: error

  web-native:
    name: Build browser native assets
    needs: windows-assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 4.0.20
          actions-cache-folder: emsdk-cache

      - name: Build Debug Godot Web extension
        shell: pwsh
        run: scripts/build-web-native.ps1 -Configuration Debug -Version '${{ needs.windows-assets.outputs.version }}' -BuildId '${{ github.sha }}'

      - name: Build Release Godot Web extension and Unity WebGL runtime
        shell: pwsh
        run: scripts/build-web-native.ps1 -Configuration Release -Version '${{ needs.windows-assets.outputs.version }}' -BuildId '${{ github.sha }}'

      - name: Verify Godot Web addon contract
        shell: pwsh
        run: scripts/verify-godot-web-addon.ps1 -RequireBinaries

      - name: Package browser native assets
        shell: pwsh
        run: |
          $root = "artifacts/web-native"
          $godot = Join-Path $root "gua-godot-plugin-web/addons/gua"
          New-Item -ItemType Directory -Force (Join-Path $root "unity"), (Join-Path $godot "bin") | Out-Null
          Copy-Item "build/web-release/native/gua-runtime/libgua_runtime.a" (Join-Path $root "unity")
          Copy-Item "build/web-release/native/gua-core/libgua-core.a" (Join-Path $root "unity")
          scripts/stage-godot-addon-sources.ps1 -AddonDirectory $godot -Version '${{ needs.windows-assets.outputs.version }}'
          Copy-Item "examples/godot-gdscript/addons/gua/bin/gua_godot.web.debug.wasm32.wasm" (Join-Path $godot "bin")
          Copy-Item "examples/godot-gdscript/addons/gua/bin/gua_godot.web.release.wasm32.wasm" (Join-Path $godot "bin")
          scripts/verify-godot-web-addon.ps1 -AddonDirectory $godot -RequireBinaries
          Compress-Archive -Path (Join-Path $root "gua-godot-plugin-web/addons") -DestinationPath (Join-Path $root "gua-godot-plugin-web-v${{ needs.windows-assets.outputs.version }}.zip")

      - name: Upload browser native assets
        uses: actions/upload-artifact@v4
        with:
          name: gua-web-native-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/web-native
          if-no-files-found: error

  godot-addon:
    name: Package cross-platform Godot addon
    needs:
      - windows-assets
      - portable-native
      - web-native
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download desktop Godot GDExtensions
        uses: actions/download-artifact@v4
        with:
          pattern: gua-godot-desktop-*
          path: artifacts/download/desktop
          merge-multiple: true

      - name: Download Web Godot GDExtensions
        uses: actions/download-artifact@v4
        with:
          name: gua-web-native-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/download/web

      - name: Assemble Godot addon
        shell: pwsh
        run: |
          $root = 'artifacts/godot-addon'
          $addon = Join-Path $root 'addons/gua'
          New-Item -ItemType Directory -Force (Join-Path $addon 'bin') | Out-Null
          scripts/stage-godot-addon-sources.ps1 -AddonDirectory $addon -Version '${{ needs.windows-assets.outputs.version }}'
          foreach ($pattern in 'gua_godot.windows.*', 'gua_godot.linux.*', 'gua_godot.macos.*', 'gua_godot.web.*') {
            $files = @(Get-ChildItem artifacts/download -Recurse -File -Filter $pattern)
            foreach ($file in $files) { Copy-Item $file.FullName (Join-Path $addon 'bin') -Force }
          }
          scripts/verify-godot-desktop-addon.ps1 -AddonDirectory $addon -Rid all -RequireBinaries
          scripts/verify-godot-web-addon.ps1 -AddonDirectory $addon -RequireBinaries
          Compress-Archive -Path (Join-Path $root 'addons') -DestinationPath "artifacts/gua-godot-addon-v${{ needs.windows-assets.outputs.version }}.zip" -CompressionLevel Optimal

      - name: Upload Godot addon
        uses: actions/upload-artifact@v4
        with:
          name: gua-godot-addon-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/gua-godot-addon-v${{ needs.windows-assets.outputs.version }}.zip
          if-no-files-found: error

  unity-package:
    name: Build Unity UPM package
    needs:
      - windows-assets
      - web-native
      - unity-desktop-native
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Unity native plugins
        uses: actions/download-artifact@v4
        with:
          name: gua-unity-desktop-native-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/unity-native

      - name: Download Web native plugins
        uses: actions/download-artifact@v4
        with:
          name: gua-web-native-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/web-native

      - name: Prepare Unity project package dependencies
        shell: pwsh
        run: scripts/prepare-unity-package-ci.ps1 -Version '${{ needs.windows-assets.outputs.version }}' -NativeAssetsRoot artifacts/unity-native

      - name: Verify Unity CI credentials
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          $missing = @('UNITY_LICENSE', 'UNITY_EMAIL', 'UNITY_PASSWORD') | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Unity UPM release requires these release-environment secrets: $($missing -join ', ')."
          }

      - name: Compile Unity package assemblies
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.3f1
          projectPath: examples/unity-smoke
          targetPlatform: StandaloneWindows64
          buildMethod: Gua.Unity.Editor.GuaUnityEditorCommands.BuildPlayer
          customParameters: -guaScene Assets/Scenes/GuaUnityFixture.unity -guaOutput /github/workspace/artifacts/unity-ci-player/GuaUnitySmoke.exe
          allowDirtyBuild: true

      - name: Package Unity UPM archive
        shell: pwsh
        run: scripts/package-unity-upm-ci.ps1 -Version '${{ needs.windows-assets.outputs.version }}' -OutputDirectory artifacts/unity-release -WebNativeDirectory artifacts/web-native

      - name: Upload Unity UPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: gua-unity-upm-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/unity-release/com.link1345.gua-${{ needs.windows-assets.outputs.version }}.tgz
          if-no-files-found: error

  unity-player-build:
    name: Build Unity ${{ matrix.rid }} Player
    needs:
      - windows-assets
      - unity-package
    runs-on: ubuntu-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: WindowsX64
            target: StandaloneWindows64
            output: /github/workspace/artifacts/unity-player/GuaUnitySmoke.exe
          - rid: linux-x64
            platform: LinuxX64
            target: StandaloneLinux64
            output: /github/workspace/artifacts/unity-player/GuaUnitySmoke
          - rid: osx-x64
            platform: MacOSX64
            target: StandaloneOSX
            output: /github/workspace/artifacts/unity-player/GuaUnitySmoke.app
          - rid: osx-arm64
            platform: MacOSArm64
            target: StandaloneOSX
            output: /github/workspace/artifacts/unity-player/GuaUnitySmoke.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gua-unity-upm-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/unity-upm
      - name: Install released UPM package into fixture
        shell: pwsh
        run: |
          $target = 'examples/unity-smoke/Packages/com.link1345.gua'
          New-Item -ItemType Directory -Force $target | Out-Null
          tar -xzf "artifacts/unity-upm/com.link1345.gua-${{ needs.windows-assets.outputs.version }}.tgz" -C artifacts/unity-upm
          Copy-Item artifacts/unity-upm/package/* $target -Recurse -Force
          $manifestPath = 'examples/unity-smoke/Packages/manifest.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.dependencies.PSObject.Properties.Remove('com.link1345.gua')
          $manifest | ConvertTo-Json -Depth 100 | Set-Content $manifestPath -Encoding utf8NoBOM
      - name: Build Unity Mono Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.3f1
          projectPath: examples/unity-smoke
          targetPlatform: ${{ matrix.target }}
          buildMethod: Gua.Unity.Editor.GuaUnityEditorCommands.BuildPlayer
          customParameters: -guaScene Assets/Scenes/GuaUnityFixture.unity -guaOutput "${{ matrix.output }}" -guaPlatform "${{ matrix.platform }}"
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v4
        with:
          name: gua-unity-player-${{ matrix.rid }}-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/unity-player
          if-no-files-found: error

  unity-editor-smoke:
    name: Smoke Unity Editor / ${{ matrix.rid }}
    needs:
      - windows-assets
      - unity-package
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            architecture: x86_64
            target: StandaloneWindows64
            kind: windows
          - rid: linux-x64
            runner: ubuntu-22.04
            architecture: x86_64
            target: StandaloneLinux64
            kind: linux
          - rid: osx-x64
            runner: macos-15-intel
            architecture: x86_64
            target: StandaloneOSX
            kind: macos
          - rid: osx-arm64
            runner: macos-latest
            architecture: arm64
            target: StandaloneOSX
            kind: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare Unity Hub compatibility path
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          sudo ln -sfn /usr/lib/unityhub /opt/unityhub
      - name: Install Unity Editor for this runner
        id: unity-setup
        uses: buildalon/unity-setup@v2
        with:
          version-file: examples/unity-smoke/ProjectSettings/ProjectVersion.txt
          unity-version: 6000.5.3f1
          architecture: ${{ matrix.architecture }}
          build-targets: ${{ matrix.target }}
          # unity-setup@v2 omits the editor architecture from its macOS cache key,
          # so an arm64 editor can otherwise be restored on the Intel runner.
          cache-installation: ${{ matrix.kind != 'macos' }}
      - name: Activate Unity license
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
      - uses: actions/download-artifact@v4
        with:
          name: gua-unity-upm-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/unity-upm
      - name: Install released UPM package into fixture
        shell: pwsh
        run: |
          $target = 'examples/unity-smoke/Packages/com.link1345.gua'
          New-Item -ItemType Directory -Force $target | Out-Null
          tar -xzf "artifacts/unity-upm/com.link1345.gua-${{ needs.windows-assets.outputs.version }}.tgz" -C artifacts/unity-upm
          Copy-Item artifacts/unity-upm/package/* $target -Recurse -Force
          $manifestPath = 'examples/unity-smoke/Packages/manifest.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.dependencies.PSObject.Properties.Remove('com.link1345.gua')
          $manifest | ConvertTo-Json -Depth 100 | Set-Content $manifestPath -Encoding utf8NoBOM
      - name: Run Editor Play Mode external smoke
        if: matrix.kind != 'linux'
        shell: pwsh
        env:
          UNITY_EXECUTABLE: ${{ steps.unity-setup.outputs.unity-editor-path }}
          GUA_UNITY_PROJECT: ${{ github.workspace }}/examples/unity-smoke
          GUA_UNITY_SCENE: Assets/Scenes/GuaUnityFixture.unity
          GUA_UNITY_EDITOR_BATCH_MODE: '1'
          # The packaged assemblies are built by this workflow with the same Unity
          # version. On a cold macOS import, the API Updater can run before uGUI's
          # UnityEngine.UI assembly reaches its search path and block play mode.
          GUA_UNITY_EDITOR_DISABLE_ASSEMBLY_UPDATER: ${{ matrix.kind == 'macos' && '1' || '0' }}
        run: dotnet test bindings/dotnet/tests/Gua.Unity.Integration.Tests/Gua.Unity.Integration.Tests.csproj -c Release --filter RenderedEditorPlayMode_ReflectsFixture
      - name: Run Editor Play Mode external smoke with Xvfb
        if: matrix.kind == 'linux'
        shell: bash
        env:
          UNITY_EXECUTABLE: ${{ steps.unity-setup.outputs.unity-editor-path }}
          GUA_UNITY_PROJECT: ${{ github.workspace }}/examples/unity-smoke
          GUA_UNITY_SCENE: Assets/Scenes/GuaUnityFixture.unity
          GUA_UNITY_EDITOR_BATCH_MODE: '1'
        run: xvfb-run --auto-servernum dotnet test bindings/dotnet/tests/Gua.Unity.Integration.Tests/Gua.Unity.Integration.Tests.csproj -c Release --filter RenderedEditorPlayMode_ReflectsFixture

  unity-player-smoke:
    name: Smoke Unity ${{ matrix.rid }} Player
    needs:
      - windows-assets
      - unity-player-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            kind: windows
          - rid: linux-x64
            runner: ubuntu-22.04
            kind: linux
          - rid: osx-x64
            runner: macos-15-intel
            kind: macos
          - rid: osx-arm64
            runner: macos-latest
            kind: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: gua-unity-player-${{ matrix.rid }}-v${{ needs.windows-assets.outputs.version }}
          path: artifacts/unity-player
      - name: Locate Player
        id: player
        shell: pwsh
        run: |
          $root = (Resolve-Path artifacts/unity-player).Path
          $player = switch ('${{ matrix.kind }}') {
            'windows' { Get-ChildItem $root -Recurse -Filter GuaUnitySmoke.exe -File | Select-Object -First 1 }
            'linux' { Get-ChildItem $root -Recurse -Filter GuaUnitySmoke -File | Select-Object -First 1 }
            default { Get-ChildItem $root -Recurse -Filter GuaUnitySmoke.app -Directory | Select-Object -First 1 }
          }
          if ($null -eq $player) { throw 'Unity Player artifact was not found.' }
          "path=$($player.FullName)" | Out-File $env:GITHUB_OUTPUT -Append
      - name: Run rendered Player integration tests
        if: matrix.kind != 'linux'
        shell: pwsh
        env:
          GUA_UNITY_PLAYER: ${{ steps.player.outputs.path }}
        run: dotnet test bindings/dotnet/tests/Gua.Unity.Integration.Tests/Gua.Unity.Integration.Tests.csproj -c Release --filter RenderedPlayer_ReflectsUiAndDispatchesButtonListener
      - name: Run rendered Player integration tests with Xvfb
        if: matrix.kind == 'linux'
        shell: bash
        env:
          GUA_UNITY_PLAYER: ${{ steps.player.outputs.path }}
        run: xvfb-run --auto-servernum dotnet test bindings/dotnet/tests/Gua.Unity.Integration.Tests/Gua.Unity.Integration.Tests.csproj -c Release --filter RenderedPlayer_ReflectsUiAndDispatchesButtonListener

  publish:
    name: Publish Gua release
    needs:
      - windows-assets
      - portable-native
      - native-package-smoke
      - unity-package
      - unity-player-smoke
      - unity-editor-smoke
      - godot-addon
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: gua-release-v${{ needs.windows-assets.outputs.version }}
          path: release-assets

      - name: Download Unity UPM package
        uses: actions/download-artifact@v4
        with:
          name: gua-unity-upm-v${{ needs.windows-assets.outputs.version }}
          path: release-assets/unity

      - name: Download cross-platform Godot addon
        uses: actions/download-artifact@v4
        with:
          name: gua-godot-addon-v${{ needs.windows-assets.outputs.version }}
          path: release-assets/godot

      - name: Download portable native archives
        uses: actions/download-artifact@v4
        with:
          pattern: gua-release-native-*
          path: release-assets/native
          merge-multiple: true

      - name: Package public GitHub Release assets
        shell: pwsh
        run: |
          scripts/package-github-release-assets.ps1 `
            -Version '${{ needs.windows-assets.outputs.version }}' `
            -WindowsAssetsDirectory release-assets `
            -NativeAssetsDirectory release-assets/native `
            -GodotAddonDirectory release-assets/godot `
            -UnityPackageDirectory release-assets/unity `
            -OutputDirectory publish-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.windows-assets.outputs.tag }}
          name: Gua v${{ needs.windows-assets.outputs.version }}
          body: |
            Automated Gua release build from `${{ github.sha }}`.

            This release contains native runtime archives for Windows x64, Linux x64, Intel macOS, and Apple Silicon macOS; the Windows Inspector installers; one Godot addon archive with desktop and Web GDExtensions; and the Unity Package Manager archive for Unity 6000.5+ Mono on Windows, Linux, and Intel/Apple Silicon macOS plus experimental WebGL runtimes.
          files: publish-assets/*
          fail_on_unmatched_files: true
