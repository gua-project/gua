<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$GODOT_PROJECT_NAME</title>
<style>html,body{margin:0;height:100%;background:#141414;color:white}canvas{width:100%;height:90%}#status{font:14px sans-serif;text-align:center}</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<div id="status">Gua compatible custom startup page</div>
<canvas id="canvas"></canvas>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const engine = new Engine(GODOT_CONFIG);
engine.startGame({canvas:document.getElementById('canvas')}).catch(error => {
  document.getElementById('status').textContent = error.message;
});
</script>
</body>
</html>
